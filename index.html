<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İç Denetim Süreci — Sahne Tabanlı Timeline</title>
<style>
/* =====================================================================
   1. TEMEL DEĞİŞKENLER VE 16:9 SAHNE ÖLÇEKLEME (letterbox)
   ===================================================================== */
:root{
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: Georgia, "EB Garamond", Garamond, "Times New Roman", serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.22,.7,.2,1);
  --spring: cubic-bezier(.3,1.45,.5,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:var(--sans);color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:#05060b;
  transform-origin:50% 50%;transform:translate(-50%,-50%) scale(.5)}
#stage.idle{cursor:none}

/* Katmanlar */
.scene{position:absolute;inset:0;width:1920px;height:1080px;display:block;opacity:0;transition:opacity .95s var(--ease);z-index:1}
.scene.show{opacity:1}
#strip{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:5;pointer-events:none;transition:opacity .8s}
#char{position:absolute;left:660px;top:566px;width:200px;height:400px;z-index:6;transition:opacity .8s}
#char svg{overflow:visible;display:block}
#hud{position:absolute;left:96px;top:64px;width:840px;z-index:7;transition:opacity .22s}
#hud.out{opacity:0}
#brand{position:absolute;right:96px;top:70px;z-index:7;font-size:18px;font-weight:600;letter-spacing:.3em;color:rgba(255,255,255,.5)}
#brand span{color:rgba(255,255,255,.3);font-weight:400}
#stage.in-finale #hud,#stage.in-finale #char,#stage.in-finale #strip{opacity:0}
#stage.in-finale #strip .dot{pointer-events:none}

/* =====================================================================
   2. HUD TİPOGRAFİSİ (sol üst metin bloğu)
   ===================================================================== */
.sec-label{display:flex;align-items:center;gap:16px;font-size:19px;font-weight:600;letter-spacing:.28em;color:rgba(255,255,255,.66)}
.sec-label .roman{color:var(--c)}
.sec-label .dash{width:44px;height:1.5px;background:rgba(255,255,255,.4)}
.bignum{display:flex;align-items:flex-start;gap:18px;margin-top:4px}
.bignum .num{font-size:178px;font-weight:200;line-height:.92;letter-spacing:-.03em;color:#fff}
.bignum .sup{display:flex;flex-direction:column;padding-top:20px}
.bignum .sup small{font-size:15px;font-weight:600;letter-spacing:.26em;color:rgba(255,255,255,.55)}
.bignum .sup b{font-size:46px;font-weight:300;line-height:1.1}
.tag{display:flex;align-items:center;gap:14px;margin-top:24px;font-size:19px;font-weight:700;letter-spacing:.22em;color:var(--c)}
.tag .ln{width:48px;height:2px;background:currentColor}
#hud h1{font-size:58px;font-weight:750;line-height:1.08;letter-spacing:-.015em;margin:14px 0 0;max-width:820px}
#hud p{font-size:29px;line-height:1.42;color:rgba(255,255,255,.62);margin:16px 0 0;max-width:740px}
/* kelime kelime blur → netlik */
.w{display:inline-block;animation:wIn .9s var(--ease) both;animation-delay:var(--d)}
@keyframes wIn{from{opacity:0;filter:blur(12px);transform:translateY(10px)}}

/* =====================================================================
   3. TIMELINE ŞERİDİ (yer çizgisi + yaylar + noktalar)
   ===================================================================== */
.arc{fill:none;stroke-width:3;stroke-linecap:round;opacity:0;transition:opacity .6s}
.arc.past{opacity:.3}
.arc.cur{opacity:1}
.dot{pointer-events:all;cursor:pointer}
.dot .dcore{fill:rgba(255,255,255,.45);transition:fill .4s}
.dot.past .dcore,.dot.cur .dcore{fill:var(--dc)}
.dot text{fill:rgba(255,255,255,.42);font-size:17px;font-weight:500;letter-spacing:.04em;transition:fill .4s}
.dot.cur text{fill:#fff}
.dot:hover text{fill:#fff}
.seclbl{font-size:15px;font-weight:700;letter-spacing:.22em}

/* =====================================================================
   4. KARAKTER ANİMASYONLARI (yürüme, göz kırpma, nefes)
   ===================================================================== */
.c-eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
#char .c-leg,#char .c-arm-l{transform-box:fill-box;transform-origin:50% 4%}
#char.walking .c-leg-l{animation:swing .5s ease-in-out infinite alternate}
#char.walking .c-leg-r{animation:swing .5s ease-in-out infinite alternate-reverse}
#char.walking .c-arm-l{animation:swing2 .5s ease-in-out infinite alternate-reverse}
#char.walking .c-body{animation:bob .25s ease-in-out infinite alternate}
#char:not(.walking) .c-body{animation:breathe 3.4s ease-in-out infinite}
#char.face-left svg{transform:scaleX(-1)}
@keyframes swing{from{transform:rotate(17deg)}to{transform:rotate(-17deg)}}
@keyframes swing2{from{transform:rotate(13deg)}to{transform:rotate(-13deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes breathe{50%{transform:translateY(-1.5px)}}

/* =====================================================================
   5. SAHNE MİKRO ANİMASYONLARI
   Kural: elemanın normal (animasyonsuz) hâli = son hâli.
   Keyframe'ler "from" durumunu tanımlar; böylece reduced-motion'da
   her şey son hâliyle görünür.
   ===================================================================== */
.fb {transform-box:fill-box;transform-origin:50% 50%}
.fbl{transform-box:fill-box;transform-origin:0 50%}
.fbt{transform-box:fill-box;transform-origin:50% 0}
.fbb{transform-box:fill-box;transform-origin:50% 100%}
.mono{font-family:var(--mono)}
.dr{stroke-dasharray:1;stroke-dashoffset:0}
.active .dr{animation:draw var(--t,.5s) ease-in-out both;animation-delay:var(--d,0s)}
.active .popin{animation:pop .55s var(--spring) both;animation-delay:var(--d,0s)}
.active .fadein{animation:fadeIn .5s ease both;animation-delay:var(--d,0s)}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}

/* S1 risk haritası */
.active .hm-cell{animation:pop .5s var(--spring) both;animation-delay:var(--d)}
.active .hm-cell.hot{animation:pop .5s var(--spring) both,hot 1.1s ease-in-out infinite;animation-delay:var(--d),calc(var(--d) + 1.3s)}
.active .hm-t{animation:fadeIn .4s both;animation-delay:calc(var(--d) + .3s)}
@keyframes hot{50%{opacity:.35}}
.scan{opacity:0}
.active .scan{animation:scan 1.9s .3s cubic-bezier(.45,0,.55,1) both}
@keyframes scan{0%{opacity:.9;transform:translateY(0)}88%{opacity:.9}100%{opacity:0;transform:translateY(432px)}}
.steam{opacity:.4;animation:steam 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}50%{opacity:.6}100%{opacity:0;transform:translateY(-24px)}}
.shaft{animation:shaft 5s ease-in-out infinite alternate}
@keyframes shaft{from{opacity:.55}to{opacity:1}}

/* S2 takvim / kontrol listesi / zarf */
.cal-page{opacity:0}
.active .cal-page{animation:flip .75s cubic-bezier(.5,0,.75,0) both;animation-delay:var(--d)}
@keyframes flip{0%{opacity:1;transform:none}70%{opacity:1;transform:scaleY(.04)}100%{opacity:0;transform:scaleY(0)}}
.active .cal-bar{animation:growX .8s var(--ease) both;animation-delay:var(--d)}
@keyframes growX{from{transform:scaleX(0)}}
.env{opacity:0}
.active .env{animation:env 1.5s cubic-bezier(.5,0,.3,1) 3.1s both}
@keyframes env{0%{opacity:1;transform:none}25%{opacity:1;transform:translateY(-22px) rotate(-3deg)}100%{opacity:0;transform:translate(300px,-560px) rotate(-18deg) scale(.45)}}
.active .sent{animation:fadeUp .6s 4s both}

/* S3 veri analizi */
.active .rows{animation:rows 9s linear infinite}
@keyframes rows{to{transform:translateY(-616px)}}
.blip{animation:blip 1s ease-in-out infinite}
@keyframes blip{50%{opacity:.3;transform:scale(1.7)}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}

/* S4 örneklem */
.sel{transform:translateY(-70px)}
.active .sel{animation:lift .6s var(--spring) both;animation-delay:var(--d)}
@keyframes lift{from{transform:translateY(0)}}
.active .sel .outline,.active .sel .tagp{animation:fadeIn .4s both;animation-delay:var(--d)}
.active .mag{animation:mag 6.5s ease-in-out infinite}
@keyframes mag{0%,100%{transform:translate(0,0)}25%{transform:translate(270px,-12px)}50%{transform:translate(560px,8px)}75%{transform:translate(270px,4px)}}

/* S5 kanıt / çalışma kâğıdı */
.active .card{animation:cardIn .8s var(--ease) both;animation-delay:var(--d)}
@keyframes cardIn{from{opacity:0;transform:translate(360px,-60px) rotate(10deg)}}
.active .conn{animation:fadeIn .5s both;animation-delay:calc(var(--d) + .6s)}
.stamp{transform:rotate(-7deg)}
.active .stamp{animation:stamp .7s cubic-bezier(.3,.6,.4,1) 3s both}
@keyframes stamp{0%{opacity:0;transform:translateY(-200px) rotate(-25deg) scale(1.5)}65%{opacity:1;transform:translateY(6px) rotate(-5deg) scale(.97)}100%{opacity:1;transform:rotate(-7deg)}}
.active .paper5{animation:thud .35s 3.45s ease-out both}
@keyframes thud{40%{transform:translateY(4px)}}

/* S6-S7 toplantı / uzlaşma */
.active .bubble{animation:pop .6s var(--spring) both;animation-delay:var(--d)}
.active .item{animation:fadeRight .5s var(--ease) both;animation-delay:var(--d)}
@keyframes fadeRight{from{opacity:0;transform:translateX(-14px)}}
.wave{animation:wave .45s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes wave{from{transform:scaleY(.25)}}
.active .slideL{animation:slideL .7s var(--ease) .7s both}
.active .slideR{animation:slideR .7s var(--ease) .7s both}
@keyframes slideL{from{opacity:0;transform:translateX(-70px)}}
@keyframes slideR{from{opacity:0;transform:translateX(70px)}}
.active .shake{animation:shake .22s ease-in-out 1.5s 6 alternate}
@keyframes shake{from{transform:translateY(-6px)}to{transform:translateY(6px)}}
.ring{animation:ring 2.2s ease-out infinite}
@keyframes ring{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(1.45)}}

/* S8 gece raporu */
.typecover{transform:translateX(480px)}
.active .typecover{animation:type var(--t,.55s) steps(24) both;animation-delay:var(--d)}
@keyframes type{from{transform:translateX(0)}}
.flicker{animation:flicker 4.5s infinite}
@keyframes flicker{0%,100%{opacity:1}46%{opacity:.82}48%{opacity:1}51%{opacity:.9}}
.twinkle{animation:twinkle 2.4s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes twinkle{to{opacity:.15}}
.active .summary{animation:pop .6s var(--spring) 4s both}

/* S9 sunum */
.sweep{transform-box:view-box;transform-origin:1400px -40px;animation:sweep 6s ease-in-out infinite alternate}
@keyframes sweep{from{transform:rotate(16deg)}to{transform:rotate(-18deg)}}
.active .bar{animation:growY .8s var(--ease) both;animation-delay:var(--d)}
@keyframes growY{from{transform:scaleY(0)}}
.nod{animation:nod 3.4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes nod{0%,70%,100%{transform:none}80%{transform:translateY(5px)}}

/* Duraklatma: sahne animasyonlarını dondur (metin kelimeleri hariç) */
#stage.frozen .scene *:not(.w),#stage.frozen #finale *:not(.w){animation-play-state:paused!important}

/* =====================================================================
   6. AÇILIŞ VE KAPANIŞ KATMANLARI
   ===================================================================== */
#intro{position:absolute;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1.1s var(--ease)}
#intro.show{opacity:1;pointer-events:auto}
.intro-text{font-family:var(--serif);font-style:italic;font-size:80px;color:#F1EDE4;letter-spacing:.005em}
.intro-sub{margin-top:36px;font-size:17px;font-weight:600;letter-spacing:.36em;color:rgba(255,255,255,.38);opacity:0}
#intro.active .intro-sub{animation:fadeIn 1s 1.6s both;opacity:1}
#finale{position:absolute;inset:0;z-index:15;opacity:0;pointer-events:none;transition:opacity 1.2s var(--ease)}
#finale.show{opacity:1;pointer-events:auto}
#finale svg{position:absolute;inset:0}
.fin-head{position:absolute;left:0;right:0;top:92px;text-align:center}
.fin-kicker{font-size:17px;font-weight:600;letter-spacing:.34em;color:rgba(255,255,255,.45)}
.fin-quote{margin-top:22px;font-family:var(--serif);font-style:italic;font-size:56px;color:#F1EDE4}
#finale .w{animation:none}
#finale.active .w{animation:wIn 1s var(--ease) both;animation-delay:var(--d)}
#finale.active .pose{animation:rise .9s var(--ease) both;animation-delay:var(--d)}
@keyframes rise{from{opacity:0;transform:translateY(40px)}}
#finale .fdot{cursor:pointer}
#finale .fdot:hover circle.core{r:9}

/* =====================================================================
   7. KONTROLLER VE İLERLEME ÇUBUĞU
   ===================================================================== */
#controls{position:absolute;right:96px;bottom:70px;z-index:30;display:flex;gap:6px;padding:8px;border-radius:999px;
  background:rgba(12,14,24,.62);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:opacity .45s}
#stage.idle #controls{opacity:0}
#controls button{width:58px;height:58px;border:0;border-radius:50%;background:transparent;color:#fff;cursor:pointer;display:grid;place-items:center;transition:background .2s}
#controls button:hover{background:rgba(255,255,255,.12)}
#controls button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#controls svg{width:26px;height:26px;fill:currentColor}
#progress{position:absolute;left:96px;right:96px;bottom:24px;height:4px;z-index:30;background:rgba(255,255,255,.14);border-radius:2px}
#progress .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff;border-radius:2px}
#progress .tick{position:absolute;top:-10px;width:24px;height:24px;margin-left:-12px;border:0;background:transparent;cursor:pointer;padding:0}
#progress .tick::after{content:"";position:absolute;left:10px;top:8px;width:4px;height:8px;border-radius:2px;background:rgba(255,255,255,.55)}
#progress .tick:hover::after{background:#fff;height:10px;top:7px}

/* =====================================================================
   8. HAREKET AZALTMA
   ===================================================================== */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div id="stage" class="frozen">
  <div id="scenes"></div>
  <svg id="strip" viewBox="0 0 1920 1080"><g id="stripG"></g></svg>
  <div id="char"></div>
  <div id="hud"></div>
  <div id="brand">İÇ DENETİM SÜRECİ <span>2026</span></div>

  <div id="finale"></div>
  <div id="intro"><div class="intro-text" id="introText"></div><div class="intro-sub">İÇ DENETİM SÜRECİ</div></div>

  <div id="controls" role="toolbar" aria-label="Oynatma kontrolleri">
    <button id="bPrev" title="Önceki sahne (←)" aria-label="Önceki sahne"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button id="bPlay" title="Oynat / Duraklat (Boşluk)" aria-label="Oynat veya duraklat"><svg viewBox="0 0 24 24"><path id="playIcon" d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
    <button id="bNext" title="Sonraki sahne (→)" aria-label="Sonraki sahne"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <button id="bRestart" title="Yeniden başlat (R)" aria-label="Yeniden başlat"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
    <button id="bFull" title="Tam ekran (F)" aria-label="Tam ekran"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zM14 4h6v6h-2V6h-4zM4 14h2v4h4v2H4zM18 14h2v6h-6v-2h4z"/></svg></button>
  </div>
  <div id="progress"><div class="fill"></div></div>
</div>

<script>
/* =====================================================================
   A. SAHNE VERİSİ — metinleri, renkleri ve süreleri buradan değiştirin
   ===================================================================== */
const SECTIONS = [
  { roman: 'I',   name: 'PLANLAMA',         color: '#5B9BFF' },  // mavi
  { roman: 'II',  name: 'TEST VE İNCELEME', color: '#2DD4BF' },  // turkuaz
  { roman: 'III', name: 'MUTABAKAT',        color: '#F5B342' },  // amber
  { roman: 'IV',  name: 'RAPORLAMA',        color: '#E08AF0' }   // mor/pembe
];

// dur = sahne süresi (ms). art = çizim fonksiyonu, prop = karakterin elindeki nesne
const SCENES = [
  { sec:0, label:'Risk',     tag:'RİSK DEĞERLENDİRMESİ',      title:'Önce riskin haritası çıkarılır.',
    desc:'Süreçler etki ve olasılığa göre puanlanır; kırmızı alanlar denetimin pusulası olur.', dur:5200, art:'risk',     prop:'folder' },
  { sec:0, label:'Program',  tag:'KAPSAM VE DENETİM PROGRAMI', title:'Kapsam netleşir, program yazılır.',
    desc:'Saha takvimi belirlenir, test adımları listelenir ve birimden bilgi/doküman talep edilir.', dur:5600, art:'program', prop:'clipboard' },
  { sec:1, label:'Veri',     tag:'VERİ ANALİZİ',              title:'Veri konuşmaya başlar.',
    desc:'Tüm popülasyon taranır; eşik dışı işlemler, tekrarlar ve anomaliler ayıklanır.', dur:5200, art:'data',       prop:'laptop' },
  { sec:1, label:'Örneklem', tag:'ÖRNEKLEM VE KONTROL TESTİ', title:'Doğru dosya, doğru soru.',
    desc:'Riskli işlemlerden örneklem seçilir; kontroller tasarım ve işleyiş yönünden test edilir.', dur:5200, art:'sample', prop:'magnifier' },
  { sec:1, label:'Kanıt',    tag:'KANIT VE ÇALIŞMA KÂĞIDI',   title:'Her tespit kanıta dayanır.',
    desc:'Belgeler çalışma kâğıdına bağlanır; yeterli ve güvenilir kanıt bulguya dönüşür.', dur:5200, art:'evidence',   prop:'folder' },
  { sec:2, label:'Paylaşım', tag:'BULGULARIN PAYLAŞILMASI',   title:'Bulgular masaya konur.',
    desc:'Tespitler birim yönetimiyle açıkça paylaşılır; kök nedenler birlikte tartışılır.', dur:5200, art:'meeting',    prop:'folder' },
  { sec:2, label:'Uzlaşma',  tag:'UZLAŞMA VE AKSİYON PLANI',  title:'Sorumlu ve termin bellidir.',
    desc:'Aksiyonlar, sorumlular ve tarihler üzerinde mutabık kalınır; imzalar atılır.', dur:5400, art:'agree',        prop:'sign' },
  { sec:3, label:'Rapor',    tag:'RAPOR YAZIMI',              title:'Gece yarısı, son cümle.',
    desc:'Bulgular önem sırasıyla yazılır; yönetici özeti büyük resmi tek sayfada anlatır.', dur:6000, art:'night',      prop:'report' },
  { sec:3, label:'Sunum',    tag:'DENETİM KOMİTESİ SUNUMU',   title:'Güvence komiteye sunulur.',
    desc:'Rapor Denetim Komitesi’ne sunulur; aksiyonların takibi başlar ve döngü yeniden döner.', dur:5600, art:'present', prop:'report' }
];

const INTRO = { text:'Bir denetim, aslında bir hikâyedir.', dur:3800 };
const OUTRO = { text:'İyi bir denetim, kurumun kendine dürüstçe baktığı andır.', dur:9000 };
const WALK_MS = 1400;           // karakterin bir noktadan diğerine yürüme süresi
const CHAR_X  = 760;            // karakterin sahnedeki sabit x konumu (ayak merkezi)
const GROUND  = 962;            // yer çizgisi (timeline) y konumu

/* =====================================================================
   B. YARDIMCILAR
   ===================================================================== */
const $ = s => document.querySelector(s);
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const N = SCENES.length;
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
function words(str, start, step){
  return str.split(' ').map((w,k) => `<span class="w" style="--d:${(start + k*step).toFixed(2)}s">${w}</span>`).join(' ');
}

/* =====================================================================
   C. KARAKTER (düz vektör müfettiş) — yerel koordinat 200×400, ayak y≈394
   ===================================================================== */
const PROPS = {
  none: '',

  <rect x="1030" y="130" width="760" height="440" rx="12" fill="#150F22" stroke="#2C2240" stroke-width="3"/>
  <rect x="1050" y="150" width="720" height="400" fill="#F6F1FA"/>
  <rect x="1050" y="150" width="720" height="44" fill="#E08AF0"/>
  <text x="1074" y="179" font-size="16" font-weight="800" letter-spacing="3" fill="#2A0F33">DENETİM KOMİTESİ · 2026/4</text>
  <text x="1074" y="250" font-size="36" font-weight="800" fill="#1E1426">İç Denetim Raporu</text>
  <text x="1074" y="284" font-size="19" fill="#7A6A86">Kredi Süreçleri · Yönetici Özeti</text>
  ${b}
  <g class="fadein" style="--d:1.8s">
    <text x="1420" y="372" font-size="56" font-weight="800" fill="#1E1426">3</text><text x="1462" y="370" font-size="20" fill="#5A4A66">bulgu · 2 aksiyon</text>
    <text x="1420" y="440" font-size="44" font-weight="800" fill="#1E1426">%100</text><text x="1560" y="438" font-size="20" fill="#5A4A66">mutabakat</text>
  </g>
  <g class="popin fb" style="--d:3.3s"><circle cx="1690" cy="490" r="54" fill="#E08AF0"/></g>
  <path class="dr" pathLength="1" style="--d:3.6s;--t:.45s" d="M1664 490 l18 18 l32 -36" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- ışıklar -->
  <polygon class="sweep" points="1370,-40 1430,-40 1640,962 1160,962" fill="url(#t-sweep)"/>
  <polygon points="726,0 794,0 930,962 590,962" fill="url(#t-spot)"/>
  <ellipse cx="760" cy="962" rx="190" ry="22" fill="#fff" opacity=".1"/>
  <!-- komite -->
  ${sil}
  <rect x="1090" y="846" width="800" height="10" fill="#2A1F3A"/>
  <rect x="1090" y="856" width="800" height="106" fill="#140E1E"/>
  <text x="1490" y="918" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="4" fill="#5E4A72">DENETİM KOMİTESİ</text>`;
};

/* =====================================================================
   E. DOM KURULUMU — sahneler, timeline şeridi, kapanış, ilerleme çubuğu
   ===================================================================== */
const stage = $('#stage'), hud = $('#hud'), charEl = $('#char'), stripG = $('#stripG');
const introEl = $('#intro'), finEl = $('#finale'), fillEl = $('#progress .fill');

$('#scenes').innerHTML = SCENES.map(s => `<svg class="scene" viewBox="0 0 1920 1080">${ART[s.art]()}</svg>`).join('');
const sceneEls = [...document.querySelectorAll('.scene')];

// Timeline noktalarının şerit üzerindeki x konumları (bölüm geçişlerinde ekstra boşluk)
const SX = SCENES.map((s,i) => i*480 + s.sec*150);
const START = -520;
(function buildStrip(){
  let h = `<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <line x1="-3000" y1="${GROUND}" x2="${SX[N-1] + 3000}" y2="${GROUND}" stroke="rgba(255,255,255,.3)" stroke-width="2"/>`;
  for (let x = -3000; x < SX[N-1] + 3000; x += 60) h += `<line x1="${x}" y1="${GROUND}" x2="${x}" y2="${GROUND+6}" stroke="rgba(255,255,255,.12)"/>`;
  SCENES.forEach((s,i) => {
    const a = i ? SX[i-1] : START, b = SX[i], m = (a + b) / 2, hh = 115 + (b - a) * .04;
    h += `<path class="arc" d="M${a} ${GROUND} Q${m} ${GROUND - 2*hh} ${b} ${GROUND}" stroke="${SECTIONS[s.sec].color}"/>`;
  });
  SECTIONS.forEach((sec,k) => {
    const first = SCENES.findIndex(s => s.sec === k), x = SX[first] - 80;
    h += `<line x1="${x}" y1="${GROUND-12}" x2="${x}" y2="${GROUND+12}" stroke="${sec.color}" stroke-width="2"/>
      <text class="seclbl" x="${x + 12}" y="${GROUND + 72}" fill="${sec.color}">${sec.roman} · ${sec.name}</text>`;
  });
  SCENES.forEach((s,i) => {
    h += `<g class="dot" data-i="${i}" style="--dc:${SECTIONS[s.sec].color}"><circle cx="${SX[i]}" cy="${GROUND}" r="24" fill="transparent"/>
      <circle class="dcore" cx="${SX[i]}" cy="${GROUND}" r="6"/><text x="${SX[i]}" y="${GROUND + 36}" text-anchor="middle">${s.label}</text></g>`;
  });
  h += `<circle id="ball" r="7" fill="#fff" filter="url(#glow)" opacity="0"/>`;
  stripG.innerHTML = h;
})();
const arcs = [...stripG.querySelectorAll('.arc')], dots = [...stripG.querySelectorAll('.dot')], ball = $('#ball');
const arcLen = arcs.map(a => a.getTotalLength());
arcs.forEach((a,i) => { a.style.strokeDasharray = arcLen[i]; a.style.strokeDashoffset = arcLen[i]; });
dots.forEach(d => d.addEventListener('click', () => userGo(+d.dataset.i)));

// Kapanış sahnesi: 4 aşama pozu + tam timeline + kapanış cümlesi
(function buildFinale(){
  const poses = [['clipboard','Risk, kapsam, program'],['magnifier','Veri, örneklem, kanıt'],['sign','Paylaşım, uzlaşma'],['report','Rapor, sunum']];
  let p = '';
  poses.forEach(([prop,sub],k) => {
    const cx = 330 + k*420, c = SECTIONS[k].color;
    p += `<g class="pose" style="--d:${(.5 + k*.25).toFixed(2)}s;--accent:${c}">
      <ellipse cx="${cx}" cy="650" rx="120" ry="16" fill="${c}" opacity=".22"/>
      <g transform="translate(${cx - 80},330) scale(.8)">${charSVG(prop)}</g>
      <text x="${cx}" y="708" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="4" fill="${c}">${SECTIONS[k].roman} · ${SECTIONS[k].name}</text>
      <text x="${cx}" y="740" text-anchor="middle" font-size="18" fill="rgba(255,255,255,.55)">${sub}</text></g>`;
  });
  const FX = SCENES.map((s,i) => 200 + (i + s.sec*.5) * 160), FY = 880;
  let t = `<line x1="120" y1="${FY}" x2="1800" y2="${FY}" stroke="rgba(255,255,255,.25)" stroke-width="2"/>`;
  SCENES.forEach((s,i) => {
    const a = i ? FX[i-1] : 120, b = FX[i];
    t += `<path class="dr" pathLength="1" style="--d:${(1.4 + i*.18).toFixed(2)}s;--t:.45s" d="M${a} ${FY} Q${(a+b)/2} ${FY - 110} ${b} ${FY}" stroke="${SECTIONS[s.sec].color}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  });
  SCENES.forEach((s,i) => {
    t += `<g class="fdot" data-i="${i}"><circle cx="${FX[i]}" cy="${FY}" r="22" fill="transparent"/><circle class="core" cx="${FX[i]}" cy="${FY}" r="6" fill="${SECTIONS[s.sec].color}"/>
      <text x="${FX[i]}" y="${FY + 36}" text-anchor="middle" font-size="16" fill="rgba(255,255,255,.6)">${s.label}</text></g>`;
  });
  SECTIONS.forEach((sec,k) => {
    const idx = SCENES.map((s,i) => s.sec === k ? i : -1).filter(i => i >= 0);
    const cx = (FX[idx[0]] + FX[idx[idx.length-1]]) / 2;
    t += `<text x="${cx}" y="${FY + 76}" text-anchor="middle" class="seclbl" fill="${sec.color}">${sec.roman}</text>`;
  });
  finEl.innerHTML = `<svg viewBox="0 0 1920 1080" width="1920" height="1080">
    <defs><radialGradient id="f-bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#171B33"/><stop offset="1" stop-color="#06070E"/></radialGradient></defs>
    <rect width="1920" height="1080" fill="url(#f-bg)"/>${p}${t}</svg>
    <div class="fin-head"><div class="fin-kicker">DÖRT AŞAMA · DOKUZ ADIM</div><div class="fin-quote">${words(OUTRO.text, .3, .12)}</div></div>`;
  finEl.querySelectorAll('.fdot').forEach(d => d.addEventListener('click', () => userGo(+d.dataset.i)));
})();

$('#introText').innerHTML = words(INTRO.text, .3, .16);

// İlerleme çubuğu işaretleri
SCENES.forEach((s,i) => {
  const b = document.createElement('button');
  b.className = 'tick'; b.style.left = (i / N * 100) + '%'; b.title = `${i+1}. ${s.label}`; b.setAttribute('aria-label', `${i+1}. sahne: ${s.label}`);
  b.onclick = () => userGo(i);
  $('#progress').appendChild(b);
});

/* =====================================================================
   F. ZAMAN ÇİZELGESİ / DURUM MAKİNESİ
   durumlar: -1 = açılış, 0..N-1 = sahneler, N = kapanış
   ===================================================================== */
const WALK = REDUCE ? 0 : WALK_MS;
const S = { i: -2, playing: true, frozen: false, t: 0, wt: 1e9, from: CHAR_X - START, to: CHAR_X - START, tx: CHAR_X - START, back: false, last: performance.now() };
let hudTimer = 0;

const dur = i => i < 0 ? INTRO.dur : i >= N ? OUTRO.dur : SCENES[i].dur;

function retrigger(el, on){                 // CSS animasyonlarını baştan başlat
  el.classList.remove('active');
  if (on){ void el.getBoundingClientRect(); el.classList.add('active'); }
}

function renderHUD(i){
  const s = SCENES[i], sec = SECTIONS[s.sec];
  clearTimeout(hudTimer);
  hud.classList.add('out');
  hudTimer = setTimeout(() => {
    hud.style.setProperty('--c', sec.color);
    hud.innerHTML = `
      <div class="sec-label"><span class="roman">${sec.roman}</span><span class="dash"></span>${sec.name}</div>
      <div class="bignum"><span class="num">${words(String(i+1).padStart(2,'0'), .15, 0)}</span>
        <span class="sup"><small>AŞAMA</small><b>${s.sec+1}/4</b></span></div>
      <div class="tag"><span class="ln"></span>${s.tag}</div>
      <h1>${words(s.title, .4, .07)}</h1>
      <p>${words(s.desc, .8, .03)}</p>`;
    hud.classList.remove('out');
  }, hud.innerHTML ? 230 : 0);
}

function go(i){
  i = Math.max(-1, Math.min(N, i));
  const prev = S.i;
  S.i = i; S.t = 0;

  introEl.classList.toggle('show', i === -1); retrigger(introEl, i === -1);
  finEl.classList.toggle('show', i === N);    retrigger(finEl, i === N);
  stage.classList.toggle('in-finale', i === N);
  sceneEls.forEach((el,k) => { el.classList.toggle('show', k === i); retrigger(el, k === i); });

  if (i >= 0 && i < N){
    const s = SCENES[i];
    renderHUD(i);
    charEl.style.setProperty('--accent', SECTIONS[s.sec].color);
    charEl.innerHTML = `<svg viewBox="0 0 200 400" width="200" height="400">${charSVG(s.prop)}</svg>`;
    // yürüyüş: şerit, geçerli nokta karakterin altına gelecek şekilde kayar
    S.from = S.tx; S.to = CHAR_X - SX[i]; S.wt = 0;
    S.back = prev > i && prev < N;
  } else if (i === -1){
    hud.innerHTML = '';
    S.from = S.to = S.tx = CHAR_X - START; S.wt = 1e9;
  }
  // yay ve nokta durumları
  arcs.forEach((a,k) => {
    a.classList.toggle('past', k < i); a.classList.toggle('cur', k === i);
    if (k < i || (k === i && S.back)) a.style.strokeDashoffset = 0;
    if (k > i) a.style.strokeDashoffset = arcLen[k];
  });
  dots.forEach((d,k) => { d.classList.toggle('past', k < i); d.classList.toggle('cur', k === i); });
}

// Kullanıcı gezinmesi: duraklatılmışsa otomatik ilerleme kapalı kalır, sahne animasyonu oynar
function userGo(i){ setFrozen(false); go(i); }
function setFrozen(v){ S.frozen = v; stage.classList.toggle('frozen', v); }
function setPlaying(v){
  S.playing = v;
  setFrozen(!v);
  $('#playIcon').setAttribute('d', v ? 'M6 4h4v16H6zM14 4h4v16h-4z' : 'M7 4v16l13-8z');
  showControls();
}
function togglePlay(){
  if (!S.playing && S.i === N && S.t >= dur(N)) { restart(); return; }
  setPlaying(!S.playing);
}
function restart(){ go(-1); setPlaying(true); }

function frame(now){
  const dt = Math.min(100, now - S.last); S.last = now;
  if (S.playing) S.t += dt;
  if (!S.frozen) S.wt += dt;

  // yürüyüş enterpolasyonu
  const p = WALK ? Math.min(1, S.wt / WALK) : 1, e = ease(p);
  S.tx = S.from + (S.to - S.from) * e;
  stripG.setAttribute('transform', `translate(${S.tx.toFixed(1)},0)`);
  const walking = p < 1 && S.to !== S.from;
  charEl.classList.toggle('walking', walking);
  charEl.classList.toggle('face-left', walking && S.to > S.from);

  // geçerli yay çizilir, ışıklı top yay üzerinde zıplar
  if (S.i >= 0 && S.i < N && !S.back){
    const a = arcs[S.i], L = arcLen[S.i];
    a.style.strokeDashoffset = L * (1 - e);
    const pt = a.getPointAtLength(L * e);
    ball.setAttribute('cx', pt.x); ball.setAttribute('cy', pt.y);
    ball.setAttribute('opacity', p < 1 ? 1 : 0);
  } else ball.setAttribute('opacity', 0);

  // ilerleme çubuğu
  const prog = S.i < 0 ? 0 : S.i >= N ? 1 : (S.i + Math.min(1, S.t / dur(S.i))) / N;
  fillEl.style.width = (prog * 100) + '%';

  // otomatik sahne geçişi
  if (S.playing && S.t >= dur(S.i)){
    if (S.i < N) go(S.i + 1);
    else setPlaying(false);
  }
  requestAnimationFrame(frame);
}

/* =====================================================================
   G. KONTROLLER, KLAVYE, ÖLÇEKLEME
   ===================================================================== */
$('#bPlay').onclick = togglePlay;
$('#bPrev').onclick = () => userGo(S.i - 1);
$('#bNext').onclick = () => userGo(S.i + 1);
$('#bRestart').onclick = restart;
$('#bFull').onclick = toggleFull;
function toggleFull(){
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}
addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); userGo(S.i + 1); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); userGo(S.i - 1); }
  else if (e.key === 'r' || e.key === 'R') restart();
  else if (e.key === 'f' || e.key === 'F') toggleFull();
});

// Kontroller fare hareketsiz kalınca gizlenir (sunum modu)
let idleTimer = 0;
function showControls(){
  stage.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (S.playing) stage.classList.add('idle'); }, 2600);
}
addEventListener('mousemove', showControls);

function fit(){
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit);
fit();

// Başlat
go(-1);
setPlaying(true);
requestAnimationFrame(frame);
</script>
</body>
</html>
